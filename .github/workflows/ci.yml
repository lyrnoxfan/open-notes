name: CI

# §10: every push and pull request compiles, runs the unit tests, runs lint and produces a
# debug build, so a regression shows up before it reaches a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      long_document_comparison:
        description: Run the same real long-document tests against baseline and fixed editors
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lint assembleDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Emulator tests are the slow, expensive half of CI: about ten minutes of boot and run for a
  # suite that already passes locally before a push. They are for changes that land on main and
  # for pull requests - work in progress on a feature branch does not need to pay for them.
  instrumented:
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Booting an emulator on a shared runner plus 31 device tests; 30 minutes is the budget the
    # job is allowed before it is called a hang.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner's /dev/kvm is root-only by default; the emulator needs it, and without
      # hardware acceleration the 30 minute timeout is not enough to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          # The app needs no Play Services, so the plain AOSP image boots faster.
          target: default
          arch: x86_64
          profile: pixel_5
          # Animations off: they change what the assertions observe and cost real seconds.
          disable-animations: true
          emulator-boot-timeout: 900
          # The seeding, reinstall and IME scripts run against their own install; see
          # app/src/androidTest/.../ScriptDriven.kt for why they cannot share this suite.
          script: bash scripts/picker-validation.sh

      # Without repository admin rights the device-test log cannot be fetched over the API, but
      # annotations are public. One annotation per failure puts the test name and its assertion
      # message on the commit instead of inside an artifact nobody opens.
      - name: Annotate failing tests
        if: failure()
        run: python3 scripts/annotate-device-failures.py

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload synthetic UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews-api${{ matrix.api-level }}
          path: app/build/ui-previews/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload isolated device validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-device-reports-api${{ matrix.api-level }}
          path: |
            build/e2e/*.txt
            build/canary/*.txt
            build/ime-roundtrip.txt
            build/long-document*.txt
            build/ui-render.txt
            build/swipe-search-regression.txt
            build/media-device.txt
            build/swipe-evidence/*.png
            build/long-document-evidence/**/*.png
          retention-days: 14
          if-no-files-found: ignore

  long-document-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.long_document_comparison
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
        editor: [baseline, fixed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The control is the old production editor with IDENTICAL new tests. A failed control
      # remains failed/red; it must not be mistaken for a passing fixed-device test.
      - name: Restore old editor for the baseline control only
        if: matrix.editor == 'baseline'
        run: |
          git fetch origin c5d019dccb6f05029c3b16bbf3f6d7dfe0b30896 --depth=1
          git show c5d019dccb6f05029c3b16bbf3f6d7dfe0b30896:app/src/main/java/com/example/privatenotes/feature/notes/NoteEditorScreen.kt > app/src/main/java/com/example/privatenotes/feature/notes/NoteEditorScreen.kt
      - name: Build actual app and instrumentation APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real first-IME and long-document comparison
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash scripts/long-document-check.sh
      - name: Upload exact comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-document-${{ matrix.editor }}-api${{ matrix.api-level }}
          path: |
            build/long-document*.txt
            build/long-document-evidence/**/*.png
          retention-days: 14
          if-no-files-found: ignore
