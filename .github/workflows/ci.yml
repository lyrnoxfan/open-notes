name: CI

# §10: every push and pull request compiles, runs the unit tests, runs lint and produces a
# debug build, so a regression shows up before it reaches a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lint assembleDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Emulator tests are the slow, expensive half of CI: about ten minutes of boot and run for a
  # suite that already passes locally before a push. They are for changes that land on main and
  # for pull requests - work in progress on a feature branch does not need to pay for them.
  instrumented:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Booting an emulator on a shared runner plus 31 device tests; 30 minutes is the budget the
    # job is allowed before it is called a hang.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner's /dev/kvm is root-only by default; the emulator needs it, and without
      # hardware acceleration the 30 minute timeout is not enough to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          # The app needs no Play Services, so the plain AOSP image boots faster.
          target: default
          arch: x86_64
          profile: pixel_5
          # Animations off: they change what the assertions observe and cost real seconds.
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew --no-daemon --stacktrace connectedCheck

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: 14
          if-no-files-found: ignore
