name: Release

# §10: pushing a version tag builds the minified, signed APK, verifies the signature and
# publishes it to the matching GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from the tag
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          version="${tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          # Deterministic and increasing across releases: 1.2.3 -> 10203.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag to versionName=$version versionCode=$code"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPEN_NOTES_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Missing repository secret OPEN_NOTES_KEYSTORE_BASE64"; exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Run the unit tests first
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release
        env:
          OPEN_NOTES_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OPEN_NOTES_KEYSTORE_PASSWORD: ${{ secrets.OPEN_NOTES_KEYSTORE_PASSWORD }}
          OPEN_NOTES_KEY_ALIAS: ${{ secrets.OPEN_NOTES_KEY_ALIAS }}
          OPEN_NOTES_KEY_PASSWORD: ${{ secrets.OPEN_NOTES_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify the APK is signed by the release key
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.OPEN_NOTES_CERT_SHA256 }}
        run: |
          set -eu
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"
          actual=$("$build_tools/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "APK certificate SHA-256: $actual"
          if [ -n "${EXPECTED_CERT_SHA256:-}" ] && [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signed with an unexpected certificate; refusing to publish."
            exit 1
          fi
          "$build_tools/aapt2" dump badging "$apk" | head -1

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
